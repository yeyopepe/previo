<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Mockup — Sección Ayuda jugador ampliada</title>
<style>
  :root {
    --bg-toolbar: #333333;
    --accent-blue: #2c7dd8;
    --accent-blue-dark: #123a66;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --bg-hover: #e8e8e8;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-1: 0 2px 6px rgba(0, 0, 0, 0.10), 0 1px 2px rgba(0, 0, 0, 0.08);
    --section-accent: #5b5f97;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem;
    background: #c2c2c2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text-primary);
  }
  .mock-frame {
    max-width: 560px;
    margin: 0 auto;
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-1);
    padding: 1.5rem;
  }
  .mock-frame__label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 1rem;
  }
  fieldset.modal__section {
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    margin: 0;
    padding: 1rem 1.25rem;
  }
  fieldset.modal__section > *:last-child {
    margin-bottom: 0;
  }
  legend.modal__section-title {
    padding: 0 0.5rem;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--section-accent);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .modal__field {
    margin-bottom: 1rem;
  }
  .modal__field label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }
  .modal__field textarea {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.875rem;
    resize: vertical;
    min-height: 70px;
  }
  .modal__field--checkbox {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .modal__field--checkbox label {
    display: inline;
    margin-bottom: 0;
    font-size: 0.875rem;
  }
  .field-label-row {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    margin-bottom: 0.25rem;
  }
  .field-label-row label {
    margin-bottom: 0;
  }
  .help-icon {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--text-muted);
    color: var(--text-light);
    font-size: 0.7rem;
    font-weight: 600;
    cursor: help;
    user-select: none;
    flex-shrink: 0;
  }
  .btn-cancel {
    padding: 0.5rem 1.25rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.875rem;
    background: var(--bg-subtle);
    color: var(--text-primary);
  }
  .btn-cancel:hover {
    background: var(--bg-hover);
  }
  .new-row-marker {
    position: relative;
  }
  .new-row-marker::before {
    content: "NUEVO EN 00212";
    position: absolute;
    right: 0;
    top: -1.1rem;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent-blue);
  }
  .existing-block {
    opacity: 0.92;
  }
  .divider-note {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin: 1.1rem 0 0.9rem;
    padding-top: 0.9rem;
    border-top: 1px dashed var(--border-neutral);
  }
</style>
</head>
<body>
  <div class="mock-frame">
    <div class="mock-frame__label">Fragmento — pestaña "Generales", sección "Ayuda jugador" (ui/componentModal.js)</div>

    <fieldset class="modal__section">
      <legend class="modal__section-title">Ayuda jugador</legend>

      <!-- Bloque ya existente (00208), sin cambios -->
      <div class="existing-block">
        <div class="modal__field modal__field--checkbox">
          <input type="checkbox" checked />
          <label>Mostrar tooltip</label>
          <span class="help-icon">?</span>
        </div>

        <div class="modal__field">
          <div class="field-label-row">
            <label>Tooltip</label>
            <span class="help-icon">?</span>
          </div>
          <textarea>Pulsa para sacar la primera carta.</textarea>
        </div>
      </div>

      <div class="divider-note">— Nuevo en esta entrada, mismo bloque "Ayuda jugador" —</div>

      <!-- Bloque NUEVO de esta entrada -->
      <div class="new-row-marker">
        <div class="modal__field modal__field--checkbox">
          <input type="checkbox" checked />
          <label>Mostrar título de componente</label>
          <span class="help-icon">?</span>
        </div>
      </div>

      <div class="modal__field" style="margin-bottom: 0;">
        <button type="button" class="btn-cancel">Editar título de componente…</button>
      </div>
    </fieldset>
  </div>
</body>
</html>
