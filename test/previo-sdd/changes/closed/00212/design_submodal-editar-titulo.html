<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Mockup — Sub-modal Editar título de componente</title>
<style>
  :root {
    --bg-toolbar: #333333;
    --accent-blue: #2c7dd8;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --border-neutral: #dcdcdc;
    --bg-subtle: #f0f0f0;
    --bg-hover: #e8e8e8;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 3rem 2rem;
    background: rgba(0,0,0,0.5);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text-primary);
    display: flex;
    justify-content: center;
  }
  .modal {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    width: 420px;
    max-width: 92vw;
    display: flex;
    flex-direction: column;
  }
  .modal__header {
    padding: 1rem;
    border-bottom: 1px solid var(--border-neutral);
    font-size: 1.05rem;
    font-weight: 600;
  }
  .modal__content {
    padding: 1.5rem;
  }
  .modal__field {
    margin-bottom: 1.25rem;
  }
  .modal__field label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }
  .field-label-row {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    margin-bottom: 0.25rem;
  }
  .field-label-row label {
    margin-bottom: 0;
  }
  .modal__field textarea {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    font-family: ui-monospace, monospace;
    font-size: 0.8125rem;
    min-height: 90px;
    resize: vertical;
  }
  .modal__hint {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin: 0.4rem 0 0;
  }
  .help-icon {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--text-muted);
    color: var(--text-light);
    font-size: 0.7rem;
    font-weight: 600;
    cursor: help;
    flex-shrink: 0;
  }
  .color-row {
    display: flex;
    gap: 1rem;
  }
  .color-row .modal__field {
    flex: 1;
    margin-bottom: 0;
  }
  input[type="color"] {
    width: 100%;
    height: 40px;
    padding: 2px;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    cursor: pointer;
    background: white;
  }
  .opacity-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.75rem;
  }
  .opacity-row input[type="range"] {
    flex: 1;
  }
  .modal__opacity-value {
    display: flex;
    align-items: center;
    gap: 0.15rem;
    font-size: 0.8125rem;
    color: var(--text-muted);
    min-width: 2.6rem;
  }
  .modal__opacity-value input[type="text"] {
    width: 2.2rem;
    padding: 0.15rem 0.25rem;
    border: 1px solid var(--border-neutral);
    border-radius: var(--radius-sm);
    font-size: 0.8125rem;
    text-align: right;
  }
  .modal__footer {
    padding: 1rem;
    border-top: 1px solid var(--border-neutral);
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
  }
  .btn-cancel, .btn-accept {
    padding: 0.5rem 1.5rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.875rem;
  }
  .btn-cancel {
    background: var(--bg-subtle);
    color: var(--text-primary);
  }
  .btn-accept {
    background: var(--accent-blue);
    color: var(--text-light);
  }
</style>
</head>
<body>
  <div class="modal">
    <div class="modal__header">Editar título de componente</div>
    <div class="modal__content">
      <div class="modal__field">
        <div class="field-label-row">
          <label>Contenido</label>
          <span class="help-icon">?</span>
        </div>
        <textarea>{cards_current} cartas</textarea>
        <p class="modal__hint">Admite formato básico (negrita, cursiva, saltos de línea, listas) y variables como <code>{cards_current}</code>.</p>
      </div>

      <div class="color-row">
        <div class="modal__field">
          <label>Color del texto</label>
          <input type="color" value="#000000" />
        </div>
        <div class="modal__field">
          <label>Color de fondo</label>
          <input type="color" value="#ffffff" />
        </div>
      </div>

      <div class="modal__field" style="margin-bottom: 0;">
        <label>Transparencia del fondo</label>
        <div class="opacity-row">
          <input type="range" min="0" max="100" value="0" />
          <div class="modal__opacity-value">
            <input type="text" value="0" readonly />
            <span>%</span>
          </div>
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <button type="button" class="btn-cancel">Cancelar</button>
      <button type="button" class="btn-accept">Aceptar</button>
    </div>
  </div>
</body>
</html>
