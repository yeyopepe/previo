<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Maqueta — Modal de operación en curso</title>
<style>
  :root {
    --accent-blue: #2c7dd8;
    --accent-blue-dark: #123a66;
    --text-primary: #1a1a1a;
    --text-light: #ffffff;
    --text-muted: #666666;
    --radius-sm: 4px;
    --radius-lg: 8px;
    --shadow-2: 0 4px 20px rgba(0, 0, 0, 0.15);
    --bg-table: #c2c2c2;
    --bg-table-dot: rgba(0, 0, 0, 0.09);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-primary);
  }

  /* Fondo de ejemplo: simula la mesa de juego detrás de la modal, para dar contexto */
  .mock-table-bg {
    position: fixed;
    inset: 0;
    background-color: var(--bg-table);
    background-image: radial-gradient(circle, var(--bg-table-dot) 1.5px, transparent 1.5px);
    background-size: 20px 20px;
  }

  .mock-label {
    position: fixed;
    top: 16px;
    left: 16px;
    font-size: 0.8rem;
    color: var(--text-muted);
    background: rgba(255,255,255,0.85);
    padding: 4px 8px;
    border-radius: var(--radius-sm);
  }

  /* Mismo patrón que .modal-overlay del proyecto */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  /* Modal de operación en curso: variante sin cabecera de icono ni pie de botones,
     a diferencia de cualquier otra modal del proyecto. */
  .progress-modal {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    width: 90%;
    max-width: 320px;
    padding: 1.75rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    text-align: center;
  }

  .progress-modal__spinner {
    width: 40px;
    height: 40px;
    border: 4px solid var(--accent-blue-light, #eaf3fc);
    border-top-color: var(--accent-blue);
    border-radius: 50%;
    animation: progress-modal-spin 0.8s linear infinite;
  }

  @keyframes progress-modal-spin {
    to { transform: rotate(360deg); }
  }

  .progress-modal__text {
    font-size: 0.95rem;
    color: var(--text-primary);
  }

  /* Segundo ejemplo, apilado debajo, para ilustrar el caso de 1 sola carta */
  .mock-examples {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3rem;
  }

  .mock-example-title {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 0.5rem;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="mock-table-bg"></div>
  <div class="mock-label">Maqueta estática — cambio 00214</div>

  <div class="mock-examples">
    <div>
      <div class="mock-example-title">Ejemplo: arrastrando 10 cartas sobre un mazo</div>
      <div class="modal-overlay" style="position: relative; inset: auto; background: transparent; z-index: auto;">
        <div class="progress-modal">
          <div class="progress-modal__spinner"></div>
          <div class="progress-modal__text">Añadiendo 10 cartas al mazo…</div>
        </div>
      </div>
    </div>

    <div>
      <div class="mock-example-title">Ejemplo: arrastrando 1 sola carta sobre un mazo</div>
      <div class="modal-overlay" style="position: relative; inset: auto; background: transparent; z-index: auto;">
        <div class="progress-modal">
          <div class="progress-modal__spinner"></div>
          <div class="progress-modal__text">Añadiendo 1 carta al mazo…</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
